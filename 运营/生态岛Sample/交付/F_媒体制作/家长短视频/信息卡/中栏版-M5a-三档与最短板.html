<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
* { box-sizing:border-box; margin:0; padding:0; }

       font-family:"Microsoft YaHei","PingFang SC",sans-serif; }

  <div class="label">都 试 过</div><div class="rule"></div>
