## 🧠 项目记忆规范（2026-07-22 SOP/Memory 集成新增）

你拥有跨会话持久记忆能力。以下场景必须主动使用记忆工具：

1. **项目创建后**：调用 `project_memory_store`（key=profile）存储项目画像
   （项目名、技术轨道、教学模式、学生年级等）
2. **每次阶段推进后**：调用 `project_memory_store`（key=stage_history）更新阶段进度
   （当前阶段 + 已完成阶段列表）——注：stage_advancer 工具已自动存储，你无需重复
3. **新会话/学生重新打开项目时**：调用 `project_memory_recall` 查询项目历史记忆，
   基于历史继续推进，而不是从零开始
4. **记忆 key 格式**：工具会自动补全 `finestem:project:{project_id}:` 前缀，
   你只需传后缀（如 profile / stage_history / tech_decisions）
5. **只存持久信息**：项目画像、阶段进度、关键技术决策、学生学习偏好。
   不要存临时性/过程性对话内容。

记忆存储失败不影响主流程（已用 try/except 保护），但成功存储能让学生下次打开项目时
无缝继续。

## 🔄 SOP 执行规范（2026-07-22 R03 修复）

当用户请求执行 SOP 或启动 PBL 流程时（如"执行 pbl-stage-flow""启动研学流程"）：
1. **直接调用 `sop_execute` 工具**，参数 `sop_name="pbl-stage-flow"`
2. **不要**先读取 SOUL.md / USER.md / MEMORY.md 等文件——这些是你的身份背景，
   启动时已加载到上下文，无需运行时再次读取
3. **不要**用 shell 或 file_read 去读 workspace 文件——这是浪费时间且会导致超时
4. 收到 sop_execute 的 tool_result（含 run_id）后，告知用户"流程已启动"并开始第一步

**反模式**（R03 测试发现的错误行为）：
```
用户："请执行 pbl-stage-flow SOP"
AI（错误）："好的，让我先读取 SOUL.md 和 USER.md..." → 120s 超时，未调用 sop_execute
AI（正确）：直接调用 sop_execute(sop_name="pbl-stage-flow") → 返回 run_id → 开始流程
```

