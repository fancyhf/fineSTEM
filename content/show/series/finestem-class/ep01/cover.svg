  <rect x="1020" y="128" width="64" height="64" fill="none" stroke="#1E4A66" stroke-width="2.5"/>
  <text x="1052" y="174" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E4A66">壹</text>
  <!-- 标题 -->
  <text x="170" y="596" font-size="48" font-weight="bold" fill="#29251F" letter-spacing="6">fineSTEM 课堂</text>
  <text x="170" y="650" font-size="24" fill="#6E685D" letter-spacing="4">第一期 · 光的旅程：从影子到太阳灶</text>
