<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Songti SC','STSong','SimSun',serif">
  <rect width="1280" height="720" fill="#F7F5F1"/>
  <rect x="36" y="36" width="1208" height="648" fill="none" stroke="#29251F" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- 地平线 -->
  <path d="M170 560 Q 640 544 1110 562" fill="none" stroke="#29251F" stroke-width="2" stroke-opacity="0.7" stroke-linecap="round"/>
  <!-- 塔 1：三层（1+2+3） -->
  <g stroke="#29251F" stroke-width="1.6" stroke-opacity="0.8">
    <rect x="330" y="474" width="66" height="66" rx="2" fill="#A8574C" fill-opacity="0.82"/>
    <rect x="309" y="398" width="108" height="66" rx="2" fill="#A8574C" fill-opacity="0.82"/>
    <rect x="288" y="322" width="150" height="66" rx="2" fill="#A8574C" fill-opacity="0.82"/>
  </g>
  <!-- 塔 2：两层（1+2） -->
  <g stroke="#29251F" stroke-width="1.6" stroke-opacity="0.8">
    <rect x="610" y="474" width="66" height="66" rx="2" fill="#4E6E86" fill-opacity="0.85"/>
    <rect x="589" y="398" width="108" height="66" rx="2" fill="#4E6E86" fill-opacity="0.85"/>
  </g>
  <!-- 塔 3：一块（1） -->
  <rect x="880" y="474" width="66" height="66" rx="2" fill="#6E7F62" fill-opacity="0.85" stroke="#29251F" stroke-width="1.6" stroke-opacity="0.8"/>
  <!-- 卷次方章 -->
  <rect x="1020" y="128" width="64" height="64" fill="none" stroke="#1E4A66" stroke-width="2.5"/>
  <text x="1052" y="174" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E4A66">壹</text>
  <!-- 标题 -->
  <text x="170" y="170" font-size="54" font-weight="bold" fill="#29251F" letter-spacing="6">递推之美</text>
  <text x="170" y="228" font-size="26" fill="#6E685D" letter-spacing="4">第一集 · 数学思维：花里藏数列</text>
  <!-- 面向标注 -->
  <g font-size="22" letter-spacing="4">
    <rect x="170" y="600" width="86" height="40" fill="none" stroke="#29251F" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="213" y="628" text-anchor="middle" fill="#29251F">家长</text>
    <rect x="272" y="600" width="86" height="40" fill="none" stroke="#4E6E86" stroke-width="1.5"/>
    <text x="315" y="628" text-anchor="middle" fill="#4E6E86">儿童</text>
  </g>
</svg>
