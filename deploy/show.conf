# Show 子系统（内容节目频道）Nginx 配置
# 部署位置：/etc/nginx/sites-enabled/show.conf
# 前置：DNSPod 添加 A 记录 show → 43.128.8.131，并执行
#       certbot --nginx -d show.wostemstudio.site
# 设计文档：.trae/documents/产品与规划/13_内容节目展示子系统_产品与技术设计_V1.0.md

server {
    listen 80;
    server_name show.wostemstudio.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name show.wostemstudio.site;

    ssl_certificate     /etc/letsencrypt/live/show.wostemstudio.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/show.wostemstudio.site/privkey.pem;

    # 前端静态（apps/show 构建产物，npm run build:show 后同步 dist/ 到此处）
    root /opt/finestem/show/dist;
    index index.html;

    # 复用同一后端进程（与主站 finestem.conf 同规则，保留 /api/ 前缀）
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 内容资源：封面 / 互动动画 html / 自托管字体 / 文档
    # （视频一律 B 站嵌入，不落盘本机）
    location /content/ {
        alias /opt/finestem/show/content/;
        add_header Cache-Control "public, max-age=3600";
        charset utf-8;
    }

    # SPA fallback（/series/xxx、/ep/xxx/xxx/play 等前端路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/show.access.log;
    error_log  /var/log/nginx/show.error.log;
}
