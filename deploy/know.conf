# Know 子系统（内容节目频道）Nginx 配置
# 部署位置：/etc/nginx/sites-enabled/know.conf
# 前置：DNSPod 添加 A 记录 know → 43.128.8.131，并执行
#       certbot --nginx -d know.wostemstudio.site
# 设计文档：.trae/documents/产品与规划/13_内容节目展示子系统_产品与技术设计_V1.0.md

server {
    listen 80;
    server_name know.wostemstudio.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name know.wostemstudio.site;

    ssl_certificate     /etc/letsencrypt/live/know.wostemstudio.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/know.wostemstudio.site/privkey.pem;

    # 前端静态（仓库内构建产物：cd $REPO && npm run build:know → apps/know/dist，dist 不进 git）
    root /opt/finestem/backend/apps/know/dist;
    index index.html;

    # 复用同一后端进程（与主站 finestem.conf 同规则，保留 /api/ 前缀）
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 内容资源：随 git 仓库分发（$REPO/content/know），git pull 即生效
    # （视频一律 B 站嵌入，不落盘本机）
    location /content/ {
        alias /opt/finestem/backend/content/know/;
        add_header Cache-Control "public, max-age=3600";
        charset utf-8;
    }

    # SPA fallback（/series/xxx、/ep/xxx/xxx/play 等前端路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/know.access.log;
    error_log  /var/log/nginx/know.error.log;
}
